<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
  <title id="t">Invented Detail</title>
  <desc id="d">Synthetic illustration of an original and restoration with a heuristic tile review map. Labels flag consistency, added detail and disagreement; they do not establish truth or AI provenance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1d16"/>
      <stop offset=".6" stop-color="#18110d"/>
      <stop offset="1" stop-color="#100b08"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4b183"/>
      <stop offset="1" stop-color="#e8875a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4b183" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f4b183" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".03"/>
    </pattern>
    <pattern id="tiles" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#ffffff" stroke-opacity=".22"/>
    </pattern>
    <pattern id="bricks" width="28" height="14" patternUnits="userSpaceOnUse">
      <rect width="28" height="14" fill="#b5654a"/>
      <path d="M0 13.5h28M14 0v7M0 7h28M0 7v7M28 7v7" stroke="#f0d8c4" stroke-opacity=".6" stroke-width="1.4"/>
    </pattern>
    <clipPath id="photo"><rect x="770" y="80" width="430" height="330" rx="10"/></clipPath>
    <g id="scene-old">
      <rect width="200" height="150" fill="#a49a8c"/>
      <rect y="0" width="200" height="46" fill="#cfc8bc"/>
      <rect x="22" y="22" width="156" height="110" fill="#8a7564"/>
      <rect x="52" y="32" width="96" height="18" fill="#3e3a36"/>
      <rect x="62" y="38" width="76" height="6" fill="#e8e1d6" opacity=".7"/>
      <rect x="34" y="68" width="66" height="46" fill="#3d3d3d"/><rect x="37" y="71" width="60" height="40" fill="#c4c2bd"/>
      <rect x="118" y="72" width="34" height="60" fill="#3a2f2a"/>
      <circle cx="135" cy="86" r="7" fill="#a59a90"/>
      <rect x="0" y="132" width="200" height="18" fill="#8d8a85"/>
    </g>
  </defs>

  <rect width="1280" height="600" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="600" rx="28" fill="url(#grid)"/>
  <circle cx="985" cy="290" r="360" fill="url(#glow)"/>

  <text x="72" y="142" fill="#f4b183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">RESTORATION HONESTY</text>
  <text x="68" y="226" fill="#f5ece4" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="80" font-weight="600" letter-spacing="-2">Invented</text>
  <text x="68" y="306" fill="#f5ece4" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="80" font-weight="600" letter-spacing="-2">Detail</text>
  <text x="72" y="356" fill="#e6d9cf" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Review what an AI restoration added.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="650">
    <rect x="72" y="398" width="198" height="40" rx="20" fill="url(#accent)"/>
    <text x="94" y="423" fill="#2a160a">Source = the evidence</text>
    <rect x="284" y="398" width="158" height="40" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
    <text x="306" y="423" fill="#f5ece4">Runs in your tab</text>
    <rect x="456" y="398" width="132" height="40" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
    <text x="478" y="423" fill="#f5ece4">MIT · ufodia</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="650">
    <rect x="72" y="476" width="14" height="14" rx="3" fill="rgb(92,196,142)"/><text x="94" y="488" fill="#e6d9cf">Faithful</text>
    <rect x="172" y="476" width="14" height="14" rx="3" fill="rgb(98,160,234)"/><text x="194" y="488" fill="#e6d9cf">Enhanced</text>
    <rect x="282" y="476" width="14" height="14" rx="3" fill="rgb(244,177,74)"/><text x="304" y="488" fill="#e6d9cf">Invented</text>
    <rect x="384" y="476" width="14" height="14" rx="3" fill="rgb(236,84,84)"/><text x="406" y="488" fill="#e6d9cf">Contradicted</text>
  </g>

  <!-- The old photo (polaroid) -->
  <g transform="translate(626 300) rotate(-7)">
    <rect x="-6" y="-6" width="232" height="196" rx="6" fill="#efe5d6"/>
    <g filter="url(#soft)" transform="translate(10 10)"><use href="#scene-old"/></g>
    <rect x="10" y="10" width="200" height="150" fill="#704214" opacity=".18"/>
    <text x="110" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b5a4c">SOURCE · 320 × 240</text>
  </g>

  <!-- The restoration with the support grid -->
  <g clip-path="url(#photo)">
    <rect x="770" y="80" width="430" height="330" fill="#c9b8a6"/>
    <rect x="770" y="80" width="430" height="100" fill="#a9cbe6"/>
    <rect x="814" y="128" width="342" height="246" fill="url(#bricks)"/>
    <rect x="808" y="120" width="354" height="12" fill="#5b3a2e"/>
    <rect x="880" y="150" width="210" height="40" fill="#22313f"/>
    <text x="985" y="177" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f3d27a">BAKERY</text>
    <circle cx="1124" cy="158" r="20" fill="#1d2b3a" stroke="#efe6d8" stroke-width="5"/>
    <rect x="842" y="230" width="140" height="102" fill="#2c3e50"/><rect x="847" y="235" width="130" height="92" fill="#d9e8f0"/>
    <rect x="1030" y="240" width="74" height="134" fill="#3e2723"/>
    <circle cx="1067" cy="270" r="15" fill="#e8b896"/>
    <circle cx="1062" cy="268" r="2" fill="#3b2a20"/><circle cx="1072" cy="268" r="2" fill="#3b2a20"/>
    <path d="M1061 276q6 5 12 0" fill="none" stroke="#7a3e2e" stroke-width="2"/>
    <rect x="770" y="374" width="430" height="36" fill="#9e9e9e"/>
    <!-- support tiles -->
    <rect x="770" y="80" width="430" height="330" fill="rgb(92,196,142)" opacity=".16"/>
    <rect x="814" y="200" width="342" height="174" fill="rgb(244,177,74)" opacity=".34"/>
    <rect x="842" y="230" width="140" height="102" fill="rgb(98,160,234)" opacity=".36"/>
    <rect x="1030" y="240" width="74" height="134" fill="rgb(92,196,142)" opacity=".3"/>
    <rect x="1046" y="248" width="44" height="44" fill="rgb(244,177,74)" opacity=".6"/>
    <rect x="1100" y="134" width="48" height="48" fill="rgb(236,84,84)" opacity=".6"/>
    <rect x="770" y="80" width="430" height="330" fill="url(#tiles)"/>
  </g>
  <rect x="770" y="80" width="430" height="330" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
  <rect x="1100" y="134" width="48" height="48" fill="none" stroke="rgb(236,84,84)" stroke-width="3"/>
  <rect x="1046" y="248" width="44" height="44" fill="none" stroke="rgb(244,177,74)" stroke-width="3"/>
  <text x="1124" y="124" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="rgb(236,84,84)">NOT IN SOURCE</text>
  <text x="1068" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="rgb(244,177,74)">INVENTED FACE</text>

  <!-- Summary card -->
  <g transform="translate(830 446)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="370" height="110" rx="16" fill="#221913" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="56" cy="55" r="34" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
    <circle cx="56" cy="55" r="34" fill="none" stroke="rgb(92,196,142)" stroke-width="10" stroke-dasharray="130 214" transform="rotate(-90 56 55)"/>
    <circle cx="56" cy="55" r="34" fill="none" stroke="rgb(98,160,234)" stroke-width="10" stroke-dasharray="32 214" stroke-dashoffset="-130" transform="rotate(-90 56 55)"/>
    <circle cx="56" cy="55" r="34" fill="none" stroke="rgb(244,177,74)" stroke-width="10" stroke-dasharray="47 214" stroke-dashoffset="-162" transform="rotate(-90 56 55)"/>
    <text x="56" y="61" text-anchor="middle" font-size="17" font-weight="800" fill="#f5ece4">76 %</text>
    <text x="108" y="44" font-size="18" font-weight="700" fill="#f5ece4">Review the details</text>
    <text x="108" y="68" font-size="13" fill="#b9a596">22 % invented · 1 % contradicted</text>
    <text x="108" y="88" font-size="13" fill="#b9a596">Synthetic example · Heuristic review map</text>
  </g>
</svg>
